<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pedidos Cadastrados</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Pedidos Cadastrados</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID Pedido</th>
                <th>ID Cliente</th>
                <th>Nome Cliente</th>
                <th>Nome Prato</th>
                <th>Valor Unitário</th>
                <th>Quantidade de Pratos</th>
                <th>Valor Total</th>
            </tr>
        </thead>
        <tbody>
            {% for pedido in pedidos %}
            <tr>
                <td>{{ pedido[0] }}</td>
                <td>{{ pedido[1] }}</td>
                <td>{{ pedido[2] }}</td>
                <td>{{ pedido[3] }}</td>
                <td>{{ pedido[4] }}</td>
                <td>{{ pedido[5] }}</td>
                <td>{{ pedido[6] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>
    <a href="/">← Novo Cadastro</a>
</body>
</html>
